name: App CI

on:
  push:
    branches:
      - electron
    paths:
      - 'src/**'
      - 'skills/**'
      - 'cliweb'
      - 'cliwebctl'
      - 'install-control-cliweb-skill'
      - 'docs/get'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/app-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'skills/**'
      - 'cliweb'
      - 'cliwebctl'
      - 'install-control-cliweb-skill'
      - 'docs/get'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/app-ci.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
